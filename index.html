<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =====================================================
         Content Security Policy
         Restricts scripts, frames, and connections to trusted
         origins only, mitigating XSS and data-injection attacks.
    ====================================================== -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; media-src 'self' blob:; connect-src 'self' https://api.web3forms.com https://api.cloudinary.com; frame-src 'none';"
    />

    <!-- =====================================================
         Resource Preloads — critical above-the-fold images
         Telling the browser to fetch these early dramatically
         improves Largest Contentful Paint (LCP).
    ====================================================== -->
    <link rel="preload" as="image" href="/src/assets/hero.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/about.png" />

    <!-- Primary SEO -->
    <title>Debipur Disha Seva Sanstha | Health, Education &amp; Community Welfare NGO</title>
    <meta name="description" content="Debipur Disha Seva Sanstha is a registered NGO in West Bengal, India, dedicated to rural healthcare, education, women empowerment, and community development since 2001." />
    <meta name="keywords" content="NGO West Bengal, Debipur Disha Seva Sanstha, rural healthcare, education NGO, women empowerment, Chandannagar, Hooghly, volunteer India, social welfare" />
    <meta name="author" content="Debipur Disha Seva Sanstha" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="Debipur Disha Seva Sanstha | Together for a Better Tomorrow" />
    <meta property="og:description" content="Join us in our mission of rural healthcare, education, and social welfare in West Bengal, India." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://debipurdisha.org" />
    <meta property="og:image" content="https://debipurdisha.org/og-image.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Debipur Disha Seva Sanstha" />
    <meta name="twitter:description" content="Empowering communities through health, education, and social initiatives in rural West Bengal." />

    <link rel="canonical" href="https://debipurdisha.org" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/src/assets/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
